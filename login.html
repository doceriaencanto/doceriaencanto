<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Doceria Encanto</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Configuração Firebase -->
    <script src="js/firebase-config.js"></script>

    <!-- JavaScript do Login -->
    <script src="js/login.js" defer></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #fff8f5;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px 30px;

            border-radius: 20px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, .12);

            text-align: center;
        }

        .logo {
            width: 130px;
            height: 130px;

            object-fit: contain;

            margin-bottom: 15px;
        }

        h1 {
            color: #ff4f87;

            font-size: 2rem;

            margin-bottom: 8px;
        }

        .subtitulo {
            color: #777;

            margin-bottom: 30px;
        }

        .campo {
            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        .campo:focus {
            border-color: #ff8ab3;
        }

        .btn-login {
            width: 100%;

            padding: 13px;

            background: #ff4f87;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: .3s;
        }

        .btn-login:hover {
            background: #e83e76;
        }

        .btn-voltar {
            display: inline-block;

            margin-top: 20px;

            color: #ff4f87;

            text-decoration: none;

            font-size: 14px;
        }

        .btn-voltar:hover {
            text-decoration: underline;
        }

        #mensagem {
            margin-bottom: 15px;

            padding: 12px;

            border-radius: 8px;

            display: none;

            font-size: 14px;
        }

        .erro {
            background: #ffe5e5;

            color: #b00020;
        }

        .sucesso {
            background: #e5f7e9;

            color: #187a2f;
        }

        @media (max-width: 500px) {

            .login-container {
                padding: 30px 20px;
            }

            .logo {
                width: 110px;
                height: 110px;
            }

            h1 {
                font-size: 1.7rem;
            }

        }

    </style>

</head>

<body>

    <div class="login-container">

        <img
            src="logo.png"
            alt="Logo Doceria Encanto"
            class="logo"
        >

        <h1>🍰 Doceria Encanto</h1>

        <p class="subtitulo">
            Acesso administrativo
        </p>


        <div id="mensagem"></div>


        <form id="form-login">

            <input
                type="email"
                id="email"
                class="campo"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="senha"
                class="campo"
                placeholder="Senha"
                required
            >

            <button
                type="submit"
                class="btn-login"
                id="btn-login"
            >
                🔐 Entrar
            </button>

        </form>


        <a
            href="index.html"
            class="btn-voltar"
        >
            ← Voltar para a página inicial
        </a>

    </div>

</body>

</html>
